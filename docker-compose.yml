services:
  healthsync:
    container_name: healthsync
    image: healthsync
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3030:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
